{% load static i18n %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول إلى لوحة التحكم | عيادة الدكتور محمد الصياد</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/medical_theme.css' %}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: linear-gradient(135deg, #173B58 0%, #0f273b 100%);">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="card border-0 rounded-4 shadow-lg p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="d-inline-block position-relative mb-3">
              <img src="{% if site_settings.logo %}{{ site_settings.logo.url }}{% else %}{% static 'img/clinic_logo.jpg' %}{% endif %}" alt="شعار عيادة الدكتور محمد الصياد" class="rounded-circle shadow-sm bg-white p-2" style="width: 100px; height: 100px; object-fit: contain; border: 3px solid rgba(40, 123, 168, 0.25);">
            </div>
            <h1 class="h4 fw-bold text-navy mb-1">بوابة إدارة العيادة</h1>
            <p class="text-muted small mb-0">عيادة الصياد | جراحة العظام والمفاصل</p>
          </div>

          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags|default:'danger' }} small py-2 mb-3" role="alert">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label for="usernameInput" class="form-label fw-semibold small">اسم المستخدم</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" name="username" id="usernameInput" class="form-control" required autofocus placeholder="اسم المستخدم">
              </div>
            </div>

            <div class="mb-4">
              <label for="passwordInput" class="form-label fw-semibold small">كلمة المرور</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" id="passwordInput" class="form-control" required placeholder="••••••••">
              </div>
            </div>

            <button type="submit" class="btn btn-medical w-100 py-2 fw-bold">
              <i class="bi bi-box-arrow-in-left me-1"></i> تسجيل الدخول
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <a href="{% url 'public:home' %}" class="small text-muted text-decoration-none">
              <i class="bi bi-arrow-right me-1"></i> العودة للموقع الرئيسي
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
