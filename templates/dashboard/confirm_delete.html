{% extends 'dashboard/base_dashboard.html' %}
{% load static i18n %}

{% block dashboard_content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 rounded-4 shadow-sm bg-white p-4 p-md-5 text-center">
      <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-inline-flex p-3 mb-3">
        <i class="bi bi-exclamation-triangle-fill fs-1"></i>
      </div>

      <h2 class="h5 fw-bold text-navy mb-2">{{ page_title }}</h2>
      <p class="text-muted small mb-4">
        هل أنت متأكد من رغبتك في حذف: <strong class="text-danger">{{ item_title }}</strong>؟
        <br>لا يمكن التراجع عن هذه العملية بعد التأكيد.
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2">
          <button type="submit" class="btn btn-danger px-4">
            <i class="bi bi-trash me-1"></i> تأكيد الحذف النهائي
          </button>
          {% if cancel_pk %}
            <a href="{% url cancel_url pk=cancel_pk %}" class="btn btn-light border px-4">إلغاء</a>
          {% else %}
            <a href="{% url cancel_url %}" class="btn btn-light border px-4">إلغاء</a>
          {% endif %}
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
