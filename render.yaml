databases:
  - name: alsayyad-clinic-preview-db
    databaseName: clinic_staging
    user: clinic_staging
    plan: free
    region: frankfurt

services:
  - type: web
    name: alsayyad-clinic-preview
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --noinput && python manage.py reset_staging_data --force
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: DJANGO_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: alsayyad-clinic-preview-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PATIENT_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: STAGING_CACHE_BACKEND
        value: locmem
      - key: STAGING_COOKIE_SECURE
        value: "True"
      - key: STAGING_SSL_REDIRECT
        value: "True"
      - key: PUBLIC_FORMS_ENABLED
        value: "True"
      - key: ADMIN_INITIAL_USERNAME
        value: "admin"
      - key: ADMIN_INITIAL_PASSWORD
        value: "admin123!"
